# Notion에서 "공개"를 켜도 git push가 없으면 호스팅이 재빌드하지 않음.
# → Notion에서 공개 체크 후, GitHub 저장소 Actions 탭 → Republish from Notion →
#   Run workflow 버튼을 눌러 수동으로 Cloudflare Pages 재배포를 트리거한다.
# 예전엔 30분마다 무조건 재배포하는 스케줄이 있었으나, 변화가 없어도 하루 종일
# 불필요하게 빌드가 도는 낭비라 제거하고 수동 트리거만 남김.
# 설정: Cloudflare Pages 프로젝트(color) → Settings → Deploy hooks 의 훅(notion-republish) URL을
#       GitHub 레포 Settings → Secrets → Actions 에 CLOUDFLARE_DEPLOY_HOOK 이름으로 저장.
#       (호스팅을 Vercel → Cloudflare Pages로 옮겼으므로 Vercel 훅은 쓰지 않는다.)
name: Republish from Notion

on:
  workflow_dispatch:
  
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages rebuild
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK 미설정 — 건너뜀"; exit 0
          fi
          curl -fsSL -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
